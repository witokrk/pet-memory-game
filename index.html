<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game: Zwierzęta (EN/PL)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f0f8ff; /* Jasnoniebieski */
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-top: 20px;
            color: #1e90ff; /* Niebieski */
            font-size: 32px;
        }
        .stats-bar {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }
        #resetButton {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        #resetButton:hover {
            background-color: #007bb5;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 120px); /* 8 par = 16 kart -> 4x4 */
            grid-gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        .card {
            width: 120px;
            height: 120px;
            background-color: #6495ed; /* Błękit kornwalijski */
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            font-size: 16px;
            user-select: none;
            transition: transform 0.3s, background-color 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .card:hover:not(.flipped) {
            transform: scale(1.05);
            background-color: #5587e2;
        }
        .card.flipped {
            background-color: #fff;
            color: black;
            border: 3px solid #1e90ff;
            transform: rotateY(0deg);
            pointer-events: none; /* Odwrócona karta jest nieklikalna */
        }
        .card.matched {
            border-color: #3cb371; /* Kolor dopasowania */
            opacity: 0.7;
            pointer-events: none;
        }
        .card-emoji {
            font-size: 40px;
            margin-bottom: 5px;
        }
        .card-lang {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
        }
        .hidden-content {
            display: none;
        }
        .card.flipped .hidden-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Zawartość początkowa (znak zapytania) */
        .card:not(.flipped) .initial-content {
            font-size: 40px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Memory: Naucz się Zwierząt 🐾</h1>
    <div class="stats-bar">
        <div id="attempts">Próby: 0</div>
        <div id="matchedCount">Pary: 0/8</div>
    </div>
    <button id="resetButton">Zacznij od nowa</button>
    <div class="game-board" id="gameBoard"></div>

    <script>
        const ANIMALS = [
            { en: 'turtle', pl: 'żółw', img: '🐢' },
            { en: 'kitten', pl: 'kotek', img: '🐈' },
            { en: 'puppy', pl: 'szczeniak', img: '🐕' },
            { en: 'rabbit', pl: 'królik', img: '🐇' },
            { en: 'bird', pl: 'ptak', img: '🐦' },
            { en: 'fish', pl: 'ryba', img: '🐠' },
            { en: 'lizard', pl: 'jaszczurka', img: '🦎' },
            { en: 'hamster', pl: 'chomik', img: '🐹' },
        ];

        let cards = [];
        let board, attemptsDisplay, matchedCountDisplay;
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let attempts = 0;
        let matchedPairs = 0;

        const synth = window.speechSynthesis;

        function updateStats() {
            attemptsDisplay.textContent = `Próby: ${attempts}`;
            matchedCountDisplay.textContent = `Pary: ${matchedPairs}/${ANIMALS.length}`;
            if (matchedPairs === ANIMALS.length) {
                setTimeout(() => alert(`Gratulacje! Wygrałeś w ${attempts} próbach!`), 300);
            }
        }

        function createCardElement(cardData) {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.pairId = cardData.pairId;
            card.dataset.isEnglish = cardData.isEnglish;

            // Początkowa zawartość (znak zapytania)
            const initialContent = document.createElement('div');
            initialContent.classList.add('initial-content');
            initialContent.textContent = '❓';
            card.appendChild(initialContent);

            // Ukryta zawartość (słówko i obrazek)
            const hiddenContent = document.createElement('div');
            hiddenContent.classList.add('hidden-content');
            
            const emoji = document.createElement('div');
            emoji.classList.add('card-emoji');
            emoji.textContent = cardData.img;

            const text = document.createElement('div');
            text.textContent = cardData.text.charAt(0).toUpperCase() + cardData.text.slice(1); // U Caps

            const langFlag = document.createElement('span');
            langFlag.classList.add('card-lang');
            langFlag.textContent = cardData.isEnglish === 'true' ? 'EN' : 'PL';
            
            hiddenContent.appendChild(emoji);
            hiddenContent.appendChild(text);
            hiddenContent.appendChild(langFlag);
            card.appendChild(hiddenContent);

            card.addEventListener('click', flipCard);
            return card;
        }

        function setupGame() {
            cards = [];
            ANIMALS.forEach(pair => {
                cards.push({ text: pair.en, pairId: pair.en, img: pair.img, isEnglish: 'true' });
                cards.push({ text: pair.pl, pairId: pair.en, img: pair.img, isEnglish: 'false' });
            });
            cards.sort(() => 0.5 - Math.random()); // Tasowanie

            board.innerHTML = '';
            cards.forEach(cardData => {
                board.appendChild(createCardElement(cardData));
            });

            attempts = 0;
            matchedPairs = 0;
            firstCard = null;
            secondCard = null;
            lockBoard = false;
            updateStats();
        }

        function flipCard() {
            if (lockBoard || this.classList.contains('matched') || this === firstCard) return;

            this.classList.add('flipped');
            
            // Odtwarzanie audio dla kart angielskich
            if (this.dataset.isEnglish === 'true') {
                const textToSpeak = this.querySelector('.hidden-content > div:nth-child(2)').textContent;
                const utter = new SpeechSynthesisUtterance(textToSpeak);
                utter.lang = 'en-US';
                synth.speak(utter);
            }

            if (!firstCard) {
                firstCard = this;
            } else {
                secondCard = this;
                attempts++;
                updateStats();
                checkForMatch();
            }
        }

        function checkForMatch() {
            const isMatch = firstCard.dataset.pairId === secondCard.dataset.pairId;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            matchedPairs++;
            updateStats();
            
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [firstCard, secondCard, lockBoard] = [null, null, false];
        }


        document.addEventListener('DOMContentLoaded', () => {
            board = document.getElementById('gameBoard');
            attemptsDisplay = document.getElementById('attempts');
            matchedCountDisplay = document.getElementById('matchedCount');
            document.getElementById('resetButton').addEventListener('click', setupGame);
            setupGame();
        });
    </script>
</body>
</html>
