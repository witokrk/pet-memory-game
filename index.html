<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pet Memory Game</title>
<style>
  body {
    font-family: "Comic Sans MS", sans-serif;
    background: #fdf6e3;
    text-align: center;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #444;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 100px);
    gap: 15px;
    justify-content: center;
    margin-top: 30px;
  }
  .card {
    width: 100px;
    height: 100px;
    background: #ffcc80;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    cursor: pointer;
    transition: transform 0.3s, background 0.3s;
  }
  .flipped {
    background: #fff8e1;
    transform: rotateY(180deg);
  }
  .matched {
    background: #c8e6c9;
    cursor: default;
  }
</style>
</head>
<body>
  <h1>🐾 Pet Memory Game 🐾</h1>
  <p>Find all the matching pets!</p>
  <div class="board" id="board"></div>
  <p id="status"></p>

  <script>
    const pets = ['🐢','🐱','🐶','🐰','🐦','🐟','🦎','🐹'];
    const board = document.getElementById('board');
    const status = document.getElementById('status');

    let cards = [...pets, ...pets];
    cards.sort(() => 0.5 - Math.random());
    let flipped = [];
    let matched = [];

    cards.forEach((emoji, index) => {
      const div = document.createElement('div');
      div.className = 'card';
      div.dataset.value = emoji;
      div.innerHTML = '❓';
      div.addEventListener('click', () => flipCard(div));
      board.appendChild(div);
    });

    function flipCard(card) {
      if (flipped.length < 2 && !card.classList.contains('flipped') && !matched.includes(card)) {
        card.classList.add('flipped');
        card.innerHTML = card.dataset.value;
        flipped.push(card);

        if (flipped.length === 2) {
          setTimeout(checkMatch, 800);
        }
      }
    }

    function checkMatch() {
      const [c1, c2] = flipped;
      if (c1.dataset.value === c2.dataset.value) {
        matched.push(c1, c2);
        c1.classList.add('matched');
        c2.classList.add('matched');
        status.textContent = `✅ Found ${matched.length / 2} / ${pets.length} pairs`;
        if (matched.length === cards.length) {
          status.textContent = '🎉 Great job! You matched them all!';
        }
      } else {
        c1.classList.remove('flipped');
        c2.classList.remove('flipped');
        c1.innerHTML = '❓';
        c2.innerHTML = '❓';
      }
      flipped = [];
    }
  </script>
</body>
</html>
