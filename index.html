<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Vocabulary Memory</title>
  <style>
    :root { --bg1:#e6f0ff; --bg2:#cfe3ff; --blue:#1e5bb8; --green:#177245; }
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(#e6f0ff,#cfe3ff) fixed;}
    .wrap{max-width:960px;margin:24px auto;padding:16px}
    h1{color:var(--blue);text-align:left;font-size:32px;margin:0 0 12px}
    .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
    .pill{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:8px 12px;border-radius:12px;color:var(--blue);font-weight:600}
    .pill.green{color:var(--green)}
    .btn{background:#fff;border:0;border-radius:14px;padding:8px 14px;box-shadow:0 3px 10px rgba(0,0,0,.12);font-weight:700;color:var(--blue);cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .card{aspect-ratio:1/1;background:#fff;border-radius:18px;box-shadow:0 6px 14px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;user-select:none;transition:transform .15s ease}
    .card:active{transform:scale(.98)}
    .hiddenSide{font-size:34px}
    .face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px}
    .face img{width:64px;height:64px;object-fit:contain}
    .label{font-size:14px;font-weight:600;color:var(--blue);text-transform:capitalize}
    .flag{position:absolute;top:8px;right:10px;font-size:18px}
    .banner{margin-top:14px;background:rgba(255,255,255,.85);padding:10px 14px;border-radius:14px;box-shadow:0 6px 14px rgba(0,0,0,.12);color:var(--green);font-weight:700}
    @media (max-width:620px){.grid{grid-template-columns:repeat(3,1fr)} .card{border-radius:14px} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🐾 Pet Vocabulary Memory</h1>
    <div class="bar">
      <div class="pill">Ruchy: <span id="moves">0</span></div>
      <div class="pill green">Pary: <span id="pairs">0</span>/8</div>
      <button class="btn" id="resetBtn" title="Reset (R)">Reset</button>
    </div>
    <div id="grid" class="grid" aria-label="Memory grid"></div>
    <div id="banner" class="banner" style="display:none"></div>
  </div>

  <script>
    // ===== DATA =====
    const TRANSLATIONS = { turtle:"żółw", kitten:"kotek", puppy:"szczeniak", rabbit:"królik", bird:"ptak", fish:"ryba", lizard:"jaszczurka", hamster:"chomik" };
    const IMAGES = {
      turtle:"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f422.svg",
      kitten:"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f431.svg",
      puppy:"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f436.svg",
      rabbit:"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f430.svg",
      bird:"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f426.svg",
      fish:"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f41f.svg",
      lizard:"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f98e.svg",
      hamster:"https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f439.svg",
    };
    const ANIMALS = ["turtle","kitten","puppy","rabbit","bird","fish","lizard","hamster"];

    // ===== STATE =====
    const grid = document.getElementById('grid');
    const movesEl = document.getElementById('moves');
    const pairsEl = document.getElementById('pairs');
    const banner = document.getElementById('banner');
    const resetBtn = document.getElementById('resetBtn');

    let cards = [];            // array of card objects
    let flipped = [];          // currently flipped (max 2)
    let moves = 0;             // moves counter
    let lock = false;          // ignore clicks during timeout

    function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

    function makeDeck(){
      const deck = ANIMALS.flatMap((name, i)=>[
        { key: name+"-en", id: i*2, name, lang: 'en', img: IMAGES[name], flipped:false, matched:false },
        { key: name+"-pl", id: i*2+1, name, lang: 'pl', img: IMAGES[name], flipped:false, matched:false },
      ]);
      return shuffle(deck);
    }

    function render(){
      grid.innerHTML = '';
      cards.forEach(card=>{
        const btn = document.createElement('button');
        btn.className = 'card';
        btn.setAttribute('aria-label', card.flipped||card.matched ? (card.lang==='en'?card.name:TRANSLATIONS[card.name]) : 'hidden card');
        btn.addEventListener('click', ()=> onFlip(card.id));

        if(card.flipped || card.matched){
          const face = document.createElement('div'); face.className='face';
          const img=document.createElement('img'); img.src=card.img; img.alt=card.name; face.appendChild(img);
          const label=document.createElement('span'); label.className='label'; label.textContent = card.lang==='en'?card.name:TRANSLATIONS[card.name]; face.appendChild(label);
          const flag=document.createElement('span'); flag.className='flag'; flag.textContent = card.lang==='en'?'🇬🇧':'🇵🇱'; face.appendChild(flag);
          btn.appendChild(face);
        } else {
          const q=document.createElement('div'); q.className='hiddenSide'; q.textContent='❓'; btn.appendChild(q);
        }
        grid.appendChild(btn);
      });

      // stats
      movesEl.textContent = moves;
      pairsEl.textContent = cards.filter(c=>c.matched).length/2;

      if(cards.every(c=>c.matched)){
        banner.style.display='block';
        banner.textContent = `🎉 Super! Wszystkie pary znalezione w ${moves} ruchach!`;
      } else {
        banner.style.display='none';
      }
    }

    function onFlip(id){
      if(lock) return;
      const card = cards.find(c=>c.id===id);
      if(!card || card.flipped || card.matched) return;

      card.flipped = true;
      flipped.push(card);

      if(flipped.length===2){
        moves++;
        const [a,b]=flipped;
        if(a.name===b.name){
          a.matched=b.matched=true;
          flipped=[];
          render();
        } else {
          lock=true; render();
          setTimeout(()=>{
            a.flipped=b.flipped=false;
            flipped=[]; lock=false; render();
          },800);
        }
      }
      render();
    }

    function reset(){
      cards = makeDeck();
      flipped = []; moves = 0; lock=false; render();
    }

    // Init
    reset();
    resetBtn.addEventListener('click', reset);
    window.addEventListener('keydown', e=>{ if(e.key.toLowerCase()==='r') reset(); });
  </script>
</body>
</html>
